name: Openwrt Builder_25.12 #SNAPSHOT

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: 0 10 * * 6

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: openwrt-25.12
  FEEDS_CONF: feeds.conf1.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part3.sh
  DIY_P2_SH: diy-part4.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E rm -rf /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
            libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano \
            ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd     
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo -E timedatectl set-timezone "Asia/Shanghai"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        
    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
          
    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH
        
    - name: Update & Install feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

        # --- Patch Golang & Rust versions ---
        echo "Start applying patches..."
        rm -rf temp_resp
        git clone -b master --single-branch https://github.com/openwrt/packages.git temp_resp
        echo "Updating golang version"
        rm -rf feeds/packages/lang/golang
        cp -r temp_resp/lang/golang feeds/packages/lang
        echo "Updating rust version"
        rm -rf feeds/packages/lang/rust
        cp -r temp_resp/lang/rust feeds/packages/lang
        rm -rf temp_resp

        git clone -b main --single-branch https://github.com/openwrt/openwrt.git temp_resp
        cp -f temp_resp/scripts/patch-kernel.sh scripts/
        rm -rf temp_resp

        echo "Fixing rust host build error"
        sed -i 's/--set=llvm\.download-ci-llvm=false/--set=llvm.download-ci-llvm=true/' feeds/packages/lang/rust/Makefile
        grep -q -- '--ci false \\' feeds/packages/lang/rust/Makefile || sed -i '/x\.py \\/a \        --ci false \\' feeds/packages/lang/rust/Makefile

        ./scripts/feeds update -a
        ./scripts/feeds install -a
        echo "Patch application completed"

    - name: Force Upgrade Go Compiler to 1.27
      run: |
        cd openwrt
        
        # 1. 安裝主機端（Host）的 Go 1.27 
        echo "=== 安裝主機端 Go 1.27 ==="
        curl -L https://go.dev -o go1.27.tar.gz
        sudo rm -rf /usr/local/go
        sudo tar -C /usr/local -xzf go1.27.tar.gz
        rm go1.27.tar.gz
        export PATH=$PATH:/usr/local/go
        go version

        # 2. 強制修改 OpenWrt 的 golang 套件定義
        echo "=== 修改 OpenWrt 原始碼中的 Go 版本定義 ==="
        GOLANG_MAKEFILE="feeds/packages/lang/golang/Makefile"
        
        if [ -f "$GOLANG_MAKEFILE" ]; then
          # 替換基礎版本號為 1.27.0
          sed -i 's/GO_VERSION:=.*/GO_VERSION:=1.27.0/' $GOLANG_MAKEFILE
          # 清空原本的雜湊校驗碼（避免下載時報 Hash mismatch 錯誤）
          sed -i 's/GO_HASH:=.*/GO_HASH:=skip/' $GOLANG_MAKEFILE
          
          echo "已成功將 OpenWrt Go Makefile 版本修改為 1.27.0"
        else
          echo "錯誤：找不到 $GOLANG_MAKEFILE 檔案！"
          exit 1
        fi

        # 3. 刪除舊的 Go 編譯殘留，強制重新準備工具鏈
        rm -rf build_dir/host/go-*
        rm -rf build_dir/target-*/go-*


    - name: Download Clash Meta Core (预置到固件)
      working-directory: openwrt
      run: |
        mkdir -p files/etc/openclash/core

        echo "Downloading Clash Meta core for amd64..."
        # 优先使用 vernesong 维护的稳定核心
        curl -L --retry 5 --retry-delay 3 \
          -o /tmp/clash_meta.tar.gz \
          "https://raw.githubusercontent.com/vernesong/OpenClash/core/master/meta/clash-linux-amd64.tar.gz" || \
        curl -L --retry 5 --retry-delay 3 \
          -o /tmp/clash_meta.tar.gz \
          "https://github.com/vernesong/OpenClash/raw/core/master/meta/clash-linux-amd64.tar.gz"

        tar -xzf /tmp/clash_meta.tar.gz -C /tmp
        # 兼容不同解压出来的文件名
        if [ -f /tmp/clash ]; then
          mv /tmp/clash files/etc/openclash/core/clash_meta
        elif [ -f /tmp/mihomo ]; then
          mv /tmp/mihomo files/etc/openclash/core/clash_meta
        else
          echo "Error: cannot find clash binary after extract"
          ls -l /tmp
          exit 1
        fi

        chmod +x files/etc/openclash/core/clash_meta
        ls -lh files/etc/openclash/core/
        echo "Clash Meta core prepared successfully"

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH
        
    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;
        
    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        export GOPROXY=https://proxy.golang.org,direct
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
        
    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT
        
    - name: Upload firmware directory
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        touch release.txt
        echo "status=success" >> $GITHUB_OUTPUT
        
    - name: Upload firmware to release
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 0
        keep_minimum_runs: 2

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@master
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 3
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
